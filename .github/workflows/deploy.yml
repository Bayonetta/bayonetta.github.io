name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages branch
        run: |
          # Create a temporary directory for the build
          mkdir -p temp-deploy
          cp -R out/* temp-deploy/
          cd temp-deploy
          
          # Initialize git if needed
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Bayonetta/bayonetta.github.io.git
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages
          
          # Remove existing files and copy new ones
          git rm -rf . || true
          cp -R ./* .
          git add .
          
          # Commit and push
          git commit -m "Deploy to GitHub Pages [skip ci]" || echo "No changes to commit"
          git push origin gh-pages --force
